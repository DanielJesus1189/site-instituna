services:
  backend:
    build:
      context: ./backend
    container_name: site-instituna-backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-28800}
    expose:
      - "4000"
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.diselab.pt
    container_name: site-instituna-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge
